<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 260" role="img" aria-label="autoants mascot"><style>
.legL,.legR,.upper,.head,.ants,.blink,.gaze,.armR,.phone,.spark,.speed{transform-box:view-box}
.upper{animation:bob 2s ease-in-out infinite}
.head{transform-origin:100px 128px;animation:tilt 4s ease-in-out infinite}
.ants{transform-origin:100px 40px;animation:sway 2s ease-in-out infinite;animation-delay:-.35s}
.blink{transform-origin:100px 78px;animation:blink 4s linear infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
@keyframes tilt{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes blink{0%,64%,70%,100%{transform:scaleY(1)}67%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.phone{transform-origin:148px 87px;animation:ring 4s linear infinite}.rings{animation:rings 4s linear infinite}.eyesA{animation:eyesA 4s linear infinite,blink 4s linear infinite}.eyesB{opacity:0;animation:eyesB 4s linear infinite}@keyframes ring{0%,15%,20%,35%,100%{transform:rotate(0)}3%,9%,23%,29%{transform:rotate(9deg)}6%,12%,26%,32%{transform:rotate(-9deg)}}@keyframes rings{0%,16%,20%,36%,100%{opacity:0}6%,26%{opacity:1}}@keyframes eyesA{0%,40%,94%,100%{opacity:1}43%,91%{opacity:0}}@keyframes eyesB{0%,40%,94%,100%{opacity:0}43%,91%{opacity:1}}</style><g class="legL"><path d="M93 208C90 226 82 232 84 244" stroke="#1e7a50" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><ellipse cx="77" cy="248" rx="19" ry="8.5" fill="#33453b"/></g><g class="legR"><path d="M107 208C110 226 118 232 116 244" stroke="#1e7a50" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><ellipse cx="123" cy="248" rx="19" ry="8.5" fill="#33453b"/></g><g class="upper"><ellipse cx="100" cy="184" rx="24" ry="30" fill="#1e7a50"/><circle cx="100" cy="141" r="14" fill="#1e7a50"/><path d="M90 146C58 150 56 178 76 176" stroke="#1e7a50" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="78" cy="176" r="10" fill="#3ddcae"/><g class="head"><g class="ants"><path d="M88 40 74 8M112 40l14-32" stroke="#ebe8e2" stroke-width="6" stroke-linecap="round"/><circle cx="74" cy="7" r="6.5" fill="#ebe8e2"/><circle cx="126" cy="7" r="6.5" fill="#ebe8e2"/></g><circle cx="100" cy="82" r="46" fill="#3ddcae"/><g class="gaze"><g class="eyesA blink"><circle cx="81" cy="78" r="7" fill="#0f5132"/><circle cx="113" cy="78" r="7" fill="#0f5132"/></g><g class="eyesB"><path d="M73 81q8 -11 16 0M105 81q8 -11 16 0" stroke="#0f5132" stroke-width="5" fill="none" stroke-linecap="round"/></g></g></g><g class="phone"><rect x="138" y="70" width="20" height="34" rx="5" fill="#0f2a1d"/><rect x="141" y="75" width="14" height="20" rx="2" fill="#ebe8e2"/></g><g class="rings" stroke="#3ddcae" stroke-width="4.5" stroke-linecap="round" fill="none"><path d="M166 74q8 13 0 26"/><path d="M175 67q13 20 0 40"/></g><path d="M110 142C140 140 152 122 146 106" stroke="#1e7a50" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="146" cy="102" r="10" fill="#3ddcae"/></g></svg>