<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 260" role="img" aria-label="autoants mascot"><style>
.legL,.legR,.upper,.head,.ants,.blink,.armR,.phone,.spark,.speed{transform-box:view-box}
.upper{animation:bob 2s ease-in-out infinite}
.head{transform-origin:100px 128px;animation:tilt 4s ease-in-out infinite}
.ants{transform-origin:100px 40px;animation:sway 2s ease-in-out infinite;animation-delay:-.35s}
.blink{transform-origin:100px 78px;animation:blink 4s linear infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
@keyframes tilt{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes blink{0%,64%,70%,100%{transform:scaleY(1)}67%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.legL{transform-origin:93px 208px;animation:stepA 1s ease-in-out infinite}.legR{transform-origin:107px 208px;animation:stepB 1s ease-in-out infinite}.upper.walk{animation:bob2 1s ease-in-out infinite}.speed{animation:speed 1s linear infinite;opacity:0}.s1{animation-delay:-.33s}.s2{animation-delay:-.66s}@keyframes stepA{0%,100%{transform:rotate(12deg)}50%{transform:rotate(-12deg)}}@keyframes stepB{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}@keyframes bob2{0%,50%,100%{transform:translateY(0)}25%,75%{transform:translateY(-4px)}}@keyframes speed{0%{transform:translateX(8px);opacity:0}30%{opacity:.9}100%{transform:translateX(-18px);opacity:0}}</style><g class="speed s0"><path d="M44 150h-22" stroke="#3ddcae" stroke-width="5" stroke-linecap="round"/></g><g class="speed s1"><path d="M38 174h-22" stroke="#3ddcae" stroke-width="5" stroke-linecap="round"/></g><g class="speed s2"><path d="M32 198h-22" stroke="#3ddcae" stroke-width="5" stroke-linecap="round"/></g><g class="legL"><path d="M93 208C90 226 82 232 84 244" stroke="#0f5132" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><ellipse cx="77" cy="248" rx="19" ry="8.5" fill="#0f2a1d"/></g><g class="legR"><path d="M107 208C110 226 118 232 116 244" stroke="#0f5132" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><ellipse cx="123" cy="248" rx="19" ry="8.5" fill="#0f2a1d"/></g><g class="upper walk"><ellipse cx="100" cy="184" rx="24" ry="30" fill="#0f5132"/><circle cx="100" cy="141" r="14" fill="#0f5132"/><g class="head"><g class="ants"><path d="M88 40 74 8M112 40l14-32" stroke="#0f5132" stroke-width="6" stroke-linecap="round"/><circle cx="74" cy="7" r="6.5" fill="#0f5132"/><circle cx="126" cy="7" r="6.5" fill="#0f5132"/></g><circle cx="100" cy="82" r="46" fill="#3ddcae"/><g class="blink"><circle cx="87" cy="78" r="7" fill="#0f5132"/><circle cx="119" cy="78" r="7" fill="#0f5132"/></g></g><path d="M90 144C92 168 104 172 115 168" stroke="#0f5132" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M110 144C142 140 166 150 178 159" stroke="#0f5132" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><g transform="translate(112 146) rotate(-8)"><rect x="0" y="0" width="64" height="44" rx="6" fill="#ebe8e2" stroke="#0f2a1d" stroke-width="3"/><path d="M5 6l27 20 27-20" stroke="#0f5132" stroke-width="4.5" fill="none" stroke-linejoin="round"/></g><circle cx="115" cy="168" r="10" fill="#3ddcae"/><circle cx="178" cy="159" r="10" fill="#3ddcae"/></g></svg>