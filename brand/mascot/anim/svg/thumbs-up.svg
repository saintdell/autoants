<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 260" role="img" aria-label="autoants mascot"><style>
.legL,.legR,.upper,.head,.ants,.blink,.armR,.phone,.spark,.speed{transform-box:view-box}
.upper{animation:bob 2s ease-in-out infinite}
.head{transform-origin:100px 128px;animation:tilt 4s ease-in-out infinite}
.ants{transform-origin:100px 40px;animation:sway 2s ease-in-out infinite;animation-delay:-.35s}
.blink{transform-origin:100px 78px;animation:blink 4s linear infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
@keyframes tilt{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes blink{0%,64%,70%,100%{transform:scaleY(1)}67%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.armR{transform-origin:110px 142px;animation:pop 4s ease-in-out infinite}.spark{transform-origin:190px 112px;animation:spark 4s ease-out infinite}@keyframes pop{0%,8%,92%,100%{transform:rotate(70deg)}20%{transform:rotate(-10deg)}26%{transform:rotate(4deg)}30%,80%{transform:rotate(0)}}@keyframes spark{0%,26%,62%,100%{transform:scale(0) rotate(0);opacity:0}36%{transform:scale(1.15) rotate(20deg);opacity:1}50%{transform:scale(.9) rotate(40deg);opacity:1}}</style><g class="legL"><path d="M93 208C90 226 82 232 84 244" stroke="#0f5132" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><ellipse cx="77" cy="248" rx="19" ry="8.5" fill="#0f2a1d"/></g><g class="legR"><path d="M107 208C110 226 118 232 116 244" stroke="#0f5132" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><ellipse cx="123" cy="248" rx="19" ry="8.5" fill="#0f2a1d"/></g><g class="upper"><ellipse cx="100" cy="184" rx="24" ry="30" fill="#0f5132"/><circle cx="100" cy="141" r="14" fill="#0f5132"/><path d="M90 142C70 150 64 176 58 194" stroke="#0f5132" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="56" cy="198" r="10" fill="#3ddcae"/><g class="head"><g class="ants"><path d="M88 40 74 8M112 40l14-32" stroke="#0f5132" stroke-width="6" stroke-linecap="round"/><circle cx="74" cy="7" r="6.5" fill="#0f5132"/><circle cx="126" cy="7" r="6.5" fill="#0f5132"/></g><circle cx="100" cy="82" r="46" fill="#3ddcae"/><g class="happy"><path d="M76 81q8 -11 16 0M108 81q8 -11 16 0" stroke="#0f5132" stroke-width="5" fill="none" stroke-linecap="round"/></g></g><g class="armR"><path d="M110 142C134 138 152 152 170 146" stroke="#0f5132" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="174" cy="146" r="10" fill="#3ddcae"/><rect x="169" y="121" width="10" height="23" rx="5" fill="#3ddcae"/></g><g class="spark"><path d="M190 98l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#3ddcae"/></g></g></svg>